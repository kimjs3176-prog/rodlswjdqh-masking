name: Windows exe 빌드

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 구성 요소 설치
        run: pip install -r requirements.txt pytest pyinstaller

      - name: 테스트
        run: python -m pytest -q

      - name: exe 만들기
        run: pyinstaller --onefile --windowed --name PDF-Masker app.py

      - name: exe 동작 확인
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PDF-Masker.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest 실패 (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Masker
          path: dist/PDF-Masker.exe

      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/PDF-Masker.exe --title "PDF 개인정보 마스킹 $env:GITHUB_REF_NAME" --notes "PDF-Masker.exe 를 내려받아 더블클릭하면 실행됩니다. 파이썬 설치가 필요 없습니다."
